<title>Seatribe Skipper App Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: eine schmale App-Spalte wie auf dem Handy; Startseite aus Kacheln, darunter Listen und ein Schritt-für-Schritt-Wizard mit fester Summenleiste. */
:root {
  --bg: #F3F7FA;
  --surface: #FFFFFF;
  --sunken: #E8EFF4;
  --ink: #0B3A53;
  --muted: #566B7D;
  --line: #D3DEE8;
  --brand: #009FE0;
  --brand-ink: #00709F;
  --btn: #007BB0;
  --btn-ink: #FFFFFF;
  --deep: #0B3A53;
  --deep-ink: #FFFFFF;
  --accent: #E89B5A;
  --ok: #1F8A5C;
  --ok-bg: #DDF3E8;
  --warn: #96600B;
  --warn-bg: #FCEFD6;
  --paper: #FFFFFF;
  --f-display: "Space Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061B27; --surface: #0D2A3A; --sunken: #0A2230; --ink: #E4F0F6; --muted: #94ABBA;
    --line: #1D4055; --brand: #2BB3EC; --brand-ink: #62C8F3; --btn: #2BB3EC; --btn-ink: #04202D;
    --deep: #134B69; --deep-ink: #FFFFFF; --accent: #F0AC72; --ok: #63CE9E; --ok-bg: #0F3B2C;
    --warn: #F4B860; --warn-bg: #3B2C0E; --paper: #102F41; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061B27; --surface: #0D2A3A; --sunken: #0A2230; --ink: #E4F0F6; --muted: #94ABBA;
  --line: #1D4055; --brand: #2BB3EC; --brand-ink: #62C8F3; --btn: #2BB3EC; --btn-ink: #04202D;
  --deep: #134B69; --deep-ink: #FFFFFF; --accent: #F0AC72; --ok: #63CE9E; --ok-bg: #0F3B2C;
  --warn: #F4B860; --warn-bg: #3B2C0E; --paper: #102F41; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
#app { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 12px; padding-block: 14px 2px; }
.top img { width: 48px; height: 48px; flex: none; background: #fff; border-radius: 50%; }
.top .name { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.1; }
.top .tag { color: var(--muted); font-size: .8rem; }
.pill { margin-left: auto; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--warn); background: var(--warn-bg); padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
.back { align-self: flex-start; background: none; border: 0; padding: 6px 0; color: var(--brand-ink); font-weight: 600;
  display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; max-width: 100%; }
.back svg { width: 18px; height: 18px; flex: none; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.letter { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--brand); padding-bottom: 14px; }
.letter img { width: 58px; height: 58px; flex: none; background: #fff; border-radius: 50%; }
.letter .who { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; line-height: 1.15; }
.letter .adr { color: var(--muted); font-size: .78rem; }
.paper .title { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; line-height: 1.2; }
.paper .when { color: var(--muted); font-size: .84rem; }
.paper ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
.paper dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
.paper dt { color: var(--muted); } .paper dd { margin: 0; overflow-wrap: anywhere; }
.miss { color: var(--warn); }
textarea.inp { min-height: 96px; resize: vertical; }
.lead { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Kacheln */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { aspect-ratio: 1 / .86; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-width: 0; }
.tile svg { width: 30px; height: 30px; color: var(--brand-ink); }
.tile .t { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; line-height: 1.15; }
.tile .s { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.tile.main { background: var(--deep); border-color: var(--deep); color: var(--deep-ink); }
.tile.main svg { color: var(--accent); }
.tile.main .s { color: #C5DCE8; }
.tile.soon { background: transparent; border-style: dashed; }

/* Listen */
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; min-width: 0; }
.row .ic { flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--sunken); display: grid; place-items: center; }
.row .ic svg { width: 21px; height: 21px; color: var(--brand-ink); }
.row .tx { flex: 1; min-width: 0; }
.row .tt { font-weight: 600; overflow-wrap: anywhere; }
.row .ss { font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
.row .chev { flex: none; width: 18px; height: 18px; color: var(--muted); }
.row.done .ic { background: var(--ok-bg); }
.row.done .ic svg { color: var(--ok); }
.state { font-size: .74rem; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.state.ok { background: var(--ok-bg); color: var(--ok); }
.state.wait { background: var(--warn-bg); color: var(--warn); }

.route { background: var(--deep); color: var(--deep-ink); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.route .ports { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; line-height: 1.15; overflow-wrap: anywhere; }
.route .ports span { color: var(--accent); padding-inline: 4px; }
.route .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: #C5DCE8; }
.route button { align-self: flex-start; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); color: #fff;
  border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: .88rem; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 12px; font-size: .86rem; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--deep-ink); }
.chip svg { width: 14px; height: 14px; }

/* Formulare */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-weight: 600; font-size: .9rem; }
.field small { color: var(--muted); font-size: .8rem; }
.inp { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px; padding: 12px 13px; min-height: 48px; }
.unit { display: flex; align-items: stretch; background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px; overflow: hidden; }
.unit input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 12px 13px; min-height: 48px; font-variant-numeric: tabular-nums; }
.unit b { flex: none; display: grid; place-items: center; padding-inline: 12px; background: var(--sunken); color: var(--muted); font-weight: 500; font-size: .86rem; }
.unit:focus-within { border-color: var(--brand); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; }
.opt input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--btn); }
.opt .ot { font-weight: 600; }
.opt .os { color: var(--muted); font-size: .86rem; }
.opt:has(input:checked) { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, var(--surface)); }
.sub { border-left: 3px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 12px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 11px; padding: 10px 12px; font-size: .88rem; }
.hint { background: var(--sunken); border-radius: 11px; padding: 11px 13px; font-size: .88rem; color: var(--muted); }

.btn { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 600; min-height: 50px; }
.btn.ghost { background: transparent; color: var(--brand-ink); border: 1.5px solid var(--line); }
.btn.wide { width: 100%; }
.steps { display: flex; gap: 5px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--brand); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.bar .in { max-width: 34rem; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.bar .sum { flex: 1; min-width: 0; }
.bar .sum small { display: block; color: var(--muted); font-size: .74rem; white-space: nowrap; }
.bar .sum strong { font-family: var(--f-display); font-size: 1.2rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .btn { padding-inline: 16px; }

/* Angebotsvorschau */
.paper { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; font-size: .95rem; }
.paper h3 { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.paper .total { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.paper table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.paper td { padding: 5px 0; vertical-align: top; }
.paper td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
.paper tr.sumrow td { border-top: 1px solid var(--line); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--deep); color: var(--deep-ink);
  padding: 10px 16px; border-radius: 99px; font-size: .9rem; font-weight: 500; z-index: 9; max-width: calc(100% - 32px); }
.owner { background: var(--warn-bg); color: var(--warn); border-radius: 11px; padding: 10px 12px; font-size: .88rem; font-weight: 500; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg label { border: 1.5px solid var(--line); background: var(--surface); border-radius: 11px; padding: 11px; text-align: center; font-weight: 600; cursor: pointer; }
.seg input { position: absolute; opacity: 0; }
.seg label:has(input:checked) { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, var(--surface)); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--brand); outline-offset: 2px; }
@media (max-width: 360px) { .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .tile, .row, .btn, .chip { transition: transform .12s ease; } .tile:active, .row:active, .btn:active { transform: scale(.98); } }
</style>

<div id="app"></div>
<div id="bar"></div>
<div id="toast" class="toast" hidden></div>

    if (d.pc) { S[d.pc] = t.checked; S.draft = null; var y2 = window.scrollY; render(); window.scrollTo(0, y2); var pc = document.getElementById(t.id); if (pc) pc.focus({ preventScroll: true }); return toast('Einstellung übernommen.'); }
    if (d.p) { S[d.p] = t.value; if (d.p === 'konto' || d.p === 'land') S.draft = null; var yy = window.scrollY, pid = t.id; render(); window.scrollTo(0, yy); var pe = document.getElementById(pid); if (pe) pe.focus({ preventScroll: true }); return toast(d.p === 'konto' ? 'Kontoart: ' + (t.value === 'agentur' ? 'Agentur' : 'Skipper') : 'Einstellung übernommen.'); }
    if (t.id === 'vm-file') { var cu = cur(); if (t.files && t.files[0]) { cu.vm = 'hinterlegt'; cu.vmName = t.files[0].name; render(); toast('Vollmacht hinterlegt (nur in diesem Prototyp).'); } return; }
    if (!S.draft) return;
    if (d.r) { S.draft[d.r] = t.value; }
    else if (d.c) { S.draft[d.c] = t.checked; }
    else return;
    var y = window.scrollY, id = t.id; render(); window.scrollTo(0, y);
    var again = document.getElementById(id); if (again) again.focus({ preventScroll: true });
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'f-neu') {
      var von = val('n-von'), nach = val('n-nach');
      if (!von || !nach) { document.getElementById('n-err').hidden = false; return; }
      var data = { von: von, nach: nach, start: val('n-start'), typ: val('n-typ'), boot: val('n-boot'), mmsi: val('n-mmsi'), eigner: val('n-eigner'), mail: val('n-mail'), baujahr: val('n-baujahr'), flagge: val('n-flagge'), laenge: val('n-laenge'), breite: val('n-breite'), tiefgang: val('n-tiefgang') };
      if (S.edit) { var u = cur(); for (var k in data) u[k] = data[k]; }
      else { data.id = Math.max.apply(null, S.list.map(function (x) { return x.id; })) + 1; data.bau = alle(); data.angebot = null; data.ausr = 'offen'; data.status = {}; S.list.push(data); S.sel = data.id; }
      S.edit = false; S.auswahl = false; go('fahrt'); toast('Überführung gespeichert (nur in diesem Prototyp).');
    } else if (ev.target.id === 'f-eigner') {
      cur().ausr = 'ausgefuellt'; go('ausruestung'); toast('Liste abgesendet. Zurück in der Skipper-Ansicht.');
    }
  });

  var h0 = location.hash.replace('#', '');
  if (NAMES.indexOf(h0) >= 0 && h0 !== 'angebot') view = h0;
  render();
})();
